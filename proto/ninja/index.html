<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>忍者 試作（なぞって斬る）</title>
<!-- 確かめるためだけの試作（10/18 本人「A」「進めてください」）。本番には使わない。外の部品は読まない＝Playables と同じ条件 -->
<style>
html,body{margin:0;height:100%;background:#0b0a16;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// 画面は 720×1280 の縦長で考え、窓に合わせて縮める（横長は左右に帯）
const W = 720, H = 1280;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = W * scale * dpr; cv.height = H * scale * dpr;
  g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', fit); fit();

// ---- 音（合成・小さめ）
let ac = null;
function snd(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain();
    o.connect(v); v.connect(ac.destination);
    if (kind === 'swish') { o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(200, t + 0.18); v.gain.setValueAtTime(0.05, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.2); }
    if (kind === 'hit') { o.type = 'square'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12); v.gain.setValueAtTime(0.08, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.14); o.start(t); o.stop(t + 0.14); }
    if (kind === 'fail') { o.type = 'triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.5); v.gain.setValueAtTime(0.09, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.start(t); o.stop(t + 0.5); }
    if (kind === 'clear') { [523, 659, 784, 1047].forEach((f, i) => { const o2 = ac.createOscillator(), v2 = ac.createGain(); o2.connect(v2); v2.connect(ac.destination); o2.frequency.value = f; v2.gain.setValueAtTime(0.05, t + i * 0.08); v2.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.2); o2.start(t + i * 0.08); o2.stop(t + i * 0.08 + 0.22); }); }
  } catch (e) {}
}

// ---- 場の状態
const INK = 1500;          // 1本の線で走れる長さ（px）
const DASH_SPEED = 5200;   // 駆け抜ける速さ（px/秒）
const HIT_R = 52;          // 線から何px以内の敵を斬るか
const ninja = { x: W / 2, y: H - 230 };
let foes = [], traps = [], fx = [], slashes = [];
let wave = 1, strokes = 0, best = 0, combo = 0, msg = null, shake = 0, stop = 0;
let drawing = null, dash = null, failed = false, hintT = 0;

function rnd(a, b) { return a + Math.random() * (b - a); }
function far(x, y, list, d) { return list.every(o => Math.hypot(o.x - x, o.y - y) > d); }
function newWave() {
  foes = []; traps = [];
  const n = Math.min(4 + wave, 10);
  let guard = 0;
  while (foes.length < n && guard++ < 500) {
    const x = rnd(80, W - 80), y = rnd(200, H - 420);
    if (far(x, y, foes, 110) && Math.hypot(x - ninja.x, y - ninja.y) > 200) foes.push({ x, y, ph: rnd(0, 6), dead: false });
  }
  const t = Math.min(wave - 1, 4);   // 2面目から罠（線が触れたら失敗）
  guard = 0;
  while (traps.length < t && guard++ < 500) {
    const x = rnd(90, W - 90), y = rnd(240, H - 460);
    if (far(x, y, foes, 120) && far(x, y, traps, 160)) traps.push({ x, y, ph: rnd(0, 6) });
  }
  strokes = 0; failed = false;
  msg = { text: `第${wave}の間`, sub: wave === 1 ? 'なぞって斬れ！　Swipe to slash!' : (traps.length ? '赤いトゲに線をふれさせるな' : ''), t: 1.6 };
}
newWave();

// ---- 入力：押した所から線を引く（線は忍者の今の場所から始まる）
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function pathLen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); return s; }
cv.addEventListener('pointerdown', e => {
  if (dash || failed) return;
  cv.setPointerCapture(e.pointerId);
  const p = pt(e);
  drawing = [{ x: ninja.x, y: ninja.y }, p];
  hintT = 99;
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pt(e), last = drawing[drawing.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 8) return;
  if (pathLen(drawing) + Math.hypot(p.x - last.x, p.y - last.y) > INK) return;  // 墨が切れたら伸びない
  drawing.push(p);
});
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
function release() {
  if (!drawing) return;
  const path = drawing; drawing = null;
  if (pathLen(path) < 40) return;
  // 線が罠に触れたか（触れた所までは走って、そこで失敗）
  strokes++; combo = 0;
  dash = { path, d: 0, len: pathLen(path), hitIdx: new Set(), trapHit: null };
  snd('swish');
}

// 線の上で d 進んだ点
function at(path, d) {
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i], l = Math.hypot(b.x - a.x, b.y - a.y);
    if (d <= l) return { x: a.x + (b.x - a.x) * d / l, y: a.y + (b.y - a.y) * d / l, ang: Math.atan2(b.y - a.y, b.x - a.x) };
    d -= l;
  }
  const a = path[path.length - 2], b = path[path.length - 1];
  return { x: b.x, y: b.y, ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
function puff(x, y, n, col) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: rnd(-260, 260), vy: rnd(-300, 120), r: rnd(14, 34), t: 0, life: rnd(0.4, 0.8), col }); }

// ---- 毎コマ
let prev = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (stop > 0) { stop -= dt; dt = 0; }   // 斬った瞬間に一瞬止める（手ごたえ）
  update(dt); draw();
  requestAnimationFrame(loop);
}
function update(dt) {
  hintT += dt;
  if (msg) { msg.t -= dt; if (msg.t <= 0) { const next = msg.next; msg = null; if (next) next(); } }
  shake = Math.max(0, shake - dt * 30);
  if (dash) {
    const before = dash.d;
    dash.d = Math.min(dash.len, dash.d + DASH_SPEED * dt);
    for (let s = before; s <= dash.d; s += 10) {      // 通った所を細かく見る
      const p = at(dash.path, s);
      ninja.x = p.x; ninja.y = p.y; ninja.ang = p.ang;
      for (const tr of traps) if (!dash.trapHit && Math.hypot(tr.x - p.x, tr.y - p.y) < 40) { dash.trapHit = tr; dash.d = s; }
      if (dash.trapHit) break;
      foes.forEach((f, i) => {
        if (!f.dead && Math.hypot(f.x - p.x, f.y - p.y) < HIT_R) {
          f.dead = true; combo++; dash.hitIdx.add(i);
          slashes.push({ x: f.x, y: f.y, ang: p.ang, t: 0 });
          puff(f.x, f.y, 14, '#d8d4e8'); snd('hit'); stop = 0.05; shake = 6;
        }
      });
    }
    if (dash.trapHit) {
      const tr = dash.trapHit; dash = null; failed = true; snd('fail'); shake = 14;
      puff(tr.x, tr.y, 20, '#e0503c');
      msg = { text: '失敗…', sub: 'トゲにふれた　もう一度', t: 1.3, next: () => { ninja.x = W / 2; ninja.y = H - 230; newWave(); } };
    } else if (dash.d >= dash.len) {
      if (combo >= 2) msg = { text: `${combo}連斬！`, sub: combo >= 4 ? 'みごと' : '', t: 0.8 };
      best = Math.max(best, combo);
      dash = null;
      if (foes.every(f => f.dead)) {
        snd('clear');
        const star = strokes <= 1 ? 3 : strokes <= 2 ? 2 : 1;
        msg = { text: '★'.repeat(star) + '☆'.repeat(3 - star), sub: `${strokes}本の線で全部斬った`, t: 1.6, next: () => { wave++; newWave(); } };
      }
    }
  }
  fx.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 - 20 * dt; });
  fx = fx.filter(p => p.t < p.life);
  slashes.forEach(s => s.t += dt); slashes = slashes.filter(s => s.t < 0.35);
}

// ---- 描く（絵は仮：丸と線だけ）
function draw() {
  g.save();
  g.translate(rnd(-shake, shake), rnd(-shake, shake));
  // 背景：夜の屋敷の床（板の線）
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1b1838'); bg.addColorStop(1, '#2b2140');
  g.fillStyle = bg; g.fillRect(-20, -20, W + 40, H + 40);
  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2;
  for (let y = 120; y < H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = 'rgba(255,240,200,0.9)'; g.beginPath(); g.arc(W - 110, 120, 46, 0, 7); g.fill();   // 月
  // 罠
  const now = performance.now() / 1000;
  for (const tr of traps) {
    g.save(); g.translate(tr.x, tr.y); g.rotate(now * 1.5 + tr.ph);
    g.fillStyle = '#e0503c'; g.beginPath();
    for (let i = 0; i < 16; i++) { const r = i % 2 ? 18 : 36, a = i * Math.PI / 8; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    g.fill(); g.restore();
  }
  // 敵（鬼の丸）
  for (const f of foes) if (!f.dead) {
    const bob = Math.sin(now * 3 + f.ph) * 4;
    g.fillStyle = '#c0392b'; g.beginPath(); g.arc(f.x, f.y + bob, 34, 0, 7); g.fill();
    g.fillStyle = '#f3e6c0'; g.beginPath(); g.moveTo(f.x - 20, f.y - 26 + bob); g.lineTo(f.x - 12, f.y - 48 + bob); g.lineTo(f.x - 4, f.y - 28 + bob); g.fill();
    g.beginPath(); g.moveTo(f.x + 20, f.y - 26 + bob); g.lineTo(f.x + 12, f.y - 48 + bob); g.lineTo(f.x + 4, f.y - 28 + bob); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(f.x - 11, f.y - 4 + bob, 7, 0, 7); g.arc(f.x + 11, f.y - 4 + bob, 7, 0, 7); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(f.x - 10, f.y - 3 + bob, 3, 0, 7); g.arc(f.x + 12, f.y - 3 + bob, 3, 0, 7); g.fill();
  }
  // 引いている線（墨の残りで色が薄くなる）
  if (drawing) {
    const left = 1 - pathLen(drawing) / INK;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = `rgba(150,220,255,${0.35 + 0.5 * left})`; g.lineWidth = 14; line(drawing);
    g.strokeStyle = '#fff'; g.lineWidth = 4; line(drawing);
    // 墨の量
    g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(60, H - 70, W - 120, 16);
    g.fillStyle = '#96dcff'; g.fillRect(60, H - 70, (W - 120) * left, 16);
  }
  // 駆け抜けた跡
  if (dash) { g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 10; const p = []; for (let s = Math.max(0, dash.d - 260); s <= dash.d; s += 12) p.push(at(dash.path, s)); if (p.length > 1) line(p); }
  // 斬った印
  for (const s of slashes) {
    const k = s.t / 0.35, L = 110;
    g.save(); g.translate(s.x, s.y); g.rotate(s.ang); g.strokeStyle = `rgba(255,255,255,${1 - k})`; g.lineWidth = 8 * (1 - k) + 2;
    g.beginPath(); g.moveTo(-L, 0); g.lineTo(L, 0); g.stroke(); g.restore();
  }
  // 煙
  for (const p of fx) { const k = p.t / p.life; g.fillStyle = p.col; g.globalAlpha = 0.7 * (1 - k); g.beginPath(); g.arc(p.x, p.y, p.r * (0.6 + k), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // 忍者（黒い丸と赤い鉢巻）
  g.save(); g.translate(ninja.x, ninja.y);
  g.fillStyle = '#0d0d14'; g.beginPath(); g.arc(0, 0, 30, 0, 7); g.fill();
  g.strokeStyle = '#e0503c'; g.lineWidth = 6; g.beginPath(); g.moveTo(-28, -8); g.lineTo(28, -8); g.stroke();
  g.fillStyle = '#f3e6c0'; g.fillRect(-16, -2, 32, 9);
  g.fillStyle = '#111'; g.fillRect(-10, 0, 5, 5); g.fillRect(5, 0, 5, 5);
  g.restore();
  g.restore();
  // 上の字
  g.fillStyle = '#f3e6c0'; g.font = 'bold 34px sans-serif'; g.textAlign = 'left';
  g.fillText(`第${wave}の間`, 30, 60);
  g.textAlign = 'right'; g.fillText(`線 ${strokes}本　最高 ${best}連斬`, W - 30, 60);
  // 最初の手本：忍者から指がなぞる絵
  if (wave === 1 && hintT < 99 && !msg) {
    const k = (hintT % 1.6) / 1.6, f = foes.filter(o => !o.dead);
    if (f.length) {
      const tx = ninja.x + (f[0].x - ninja.x) * k, ty = ninja.y + (f[0].y - ninja.y) * k;
      g.strokeStyle = 'rgba(150,220,255,0.6)'; g.lineWidth = 10; g.beginPath(); g.moveTo(ninja.x, ninja.y); g.lineTo(tx, ty); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.arc(tx + 18, ty + 24, 22, 0, 7); g.fill();
    }
  }
  if (msg) {
    g.textAlign = 'center'; g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, H / 2 - 110, W, 190);
    g.fillStyle = '#ffe08a'; g.font = 'bold 76px sans-serif'; g.fillText(msg.text, W / 2, H / 2);
    if (msg.sub) { g.fillStyle = '#f3e6c0'; g.font = 'bold 32px sans-serif'; g.fillText(msg.sub, W / 2, H / 2 + 56); }
  }
}
function line(p) { g.beginPath(); g.moveTo(p[0].x, p[0].y); for (let i = 1; i < p.length; i++) g.lineTo(p[i].x, p[i].y); g.stroke(); }
requestAnimationFrame(loop);
</script>
</body>
</html>
