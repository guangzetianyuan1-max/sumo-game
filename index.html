<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SUMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #141a2e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: manipulation; }
  #game { width: 100vw; height: 100vh; height: 100dvh; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SUMO">
<meta name="theme-color" content="#141a2e">
<script>
(function(){var mine="11";
fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  if(j&&j.v&&String(j.v)!==mine){var u=new URL(location.href);if(u.searchParams.get("v")!==String(j.v)){u.searchParams.set("v",j.v);location.replace(u.toString());}}
}).catch(function(){});})();
</script>
</head>
<body>
<div id="game"></div>
<div id="err" style="display:none;position:fixed;left:0;right:0;bottom:0;padding:8px 12px;background:#b3261e;color:#fff;font:13px/1.4 sans-serif;z-index:9;white-space:pre-wrap"></div>
<script>
// テスト中だけ：スマホで起きたエラーを画面の下に赤で出す（写真で送ってもらえるように）
(function () {
  var box = document.getElementById('err'), seen = {};
  function show(msg) {
    if (seen[msg]) return; seen[msg] = 1;
    box.style.display = 'block';
    box.textContent = (box.textContent ? box.textContent + '\n' : '') + 'エラー: ' + msg;
  }
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : '';
    show(String(e.message) + where);
  });
  window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script type="module" src="src/main.js?v=11"></script>
</body>
</html>
