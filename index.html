<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>トントン紙相撲 | Ton-Ton Paper Sumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #141a2e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: manipulation; }
  #game { width: 100vw; height: 100vh; height: 100dvh; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トントン紙相撲">
<meta name="theme-color" content="#141a2e">
<script>
(function(){var mine="60",done=false,timer=null;
function load(){if(done)return;done=true;clearTimeout(timer);var go=function(){var s=document.createElement("script");s.type="module";s.src="src/main.js?v="+encodeURIComponent(mine);document.body.appendChild(s);};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();}
timer=setTimeout(load,1500);
try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  if(done)return;
  if(j&&j.v&&String(j.v)!==mine){var u=new URL(location.href);if(u.searchParams.get("v")!==String(j.v)){done=true;clearTimeout(timer);u.searchParams.set("v",j.v);location.replace(u.toString());return;}}
  load();
}).catch(load);}catch(e){load();}})();
</script>
</head>
<body>
<div id="game"></div>
<button id="music" aria-label="music" style="display:none;position:fixed;z-index:8;border:0;border-radius:50%;background:#20285a;color:#e8c46a;font-family:sans-serif;padding:0;cursor:pointer;line-height:1"></button>
<div id="err" style="display:none;position:fixed;left:0;right:0;bottom:0;padding:8px 12px;background:#b3261e;color:#fff;font:13px/1.4 sans-serif;z-index:9;white-space:pre-wrap"></div>
<script>
// テスト中だけ：スマホで起きたエラーを画面の下に赤で出す（写真で送ってもらえるように）。
// 公開版（GitHub Pages）では出さない＝手もとの確かめ（localhost・127.0.0.1・ファイル）か、URL に ?debug がある時だけ（10/15 バグ出し：赤い帯がボタンの下の縁を隠した）
(function () {
  var h = location.hostname, local = location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || /(^|[?&])debug(=|&|$)/.test(location.search.slice(1));
  if (!local) return;
  var box = document.getElementById('err'), seen = {};
  function show(msg) {
    if (seen[msg]) return; seen[msg] = 1;
    box.style.display = 'block';
    box.textContent = (box.textContent ? box.textContent + '\n' : '') + 'エラー: ' + msg;
  }
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : '';
    show(String(e.message) + where);
  });
  window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
</body>
</html>
